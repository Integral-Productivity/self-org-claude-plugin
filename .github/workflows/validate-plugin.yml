name: Validate plugin manifest

# Gate every PR on `claude plugin validate` so a plugin that is valid JSON but
# invalid against the Claude Code plugin schema cannot reach `main`. Delegates
# to the org-wide reusable workflow in devops-excellence (ADR-038) so the gate
# stays DRY across every *-claude-plugin repo.
#
# `claude plugin validate` is a local, auth-free schema check (no API key, no
# login), so it needs no secrets.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    uses: Integral-Productivity/reusable-workflows/.github/workflows/validate-plugin-manifest.yml@8c04e03324d85c1f0432890946fdd04d30d64325 # v1.6.0

  # The repo also serves itself as a one-plugin marketplace (ADR-0016), so its
  # catalog gets the same schema gate as its manifest.
  validate-marketplace:
    uses: Integral-Productivity/reusable-workflows/.github/workflows/validate-plugin-manifest.yml@8c04e03324d85c1f0432890946fdd04d30d64325 # v1.6.0
    with:
      manifest-path: .claude-plugin/marketplace.json
